apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasktime.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tasktime.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.database.url | quote }}
  DATABASE_USERNAME: {{ .Values.database.username | quote }}
  DATABASE_PASSWORD: {{ .Values.database.password | quote }}
