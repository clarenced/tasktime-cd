apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktime-dev
  namespace: argo-cd
spec:
  project: tasktime-cd
  source:
    repoURL: https://github.com/clarenced/tasktime-cd.git
    targetRevision: main
    path: tasktime
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: tasktime
  syncPolicy:
    automated:
      prune: true 
      selfHeal: true 

