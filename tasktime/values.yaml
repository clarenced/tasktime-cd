# Default values for tasktime.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: ghcr.io/clarenced/tasktime
  version: 1.1.2
  pullPolicy: IfNotPresent

imagePullSecrets:
 - name: ghcr-pull-secret
  
service:
  type: NodePort
  port: 8080
  nodePort: 31000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
